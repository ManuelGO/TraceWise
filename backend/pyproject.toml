[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracewise-backend"
version = "0.1.0"
description = "TraceWise AI Backend - AI-assisted supply chain compliance platform"
authors = [{name = "Manuel Gonzalez Arvelo", email = "manuelarvelo19@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.3",
    "uvicorn[standard]==0.46.0",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.38",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.6",
    "python-magic==0.4.27",
    "filetype==1.2.0",
    "celery==5.3.6",
    "pypdf==4.0.1",
    "python-docx==0.8.11",
    "pandas==2.2.0",
    "openpyxl==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "httpx==0.27.0",
    "ruff==0.8.4",
    "mypy==1.8.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
exclude = ["venv/", "tests/", "migrations/"]
allow_redefinition = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.config"
# Pydantic v2 ConfigDict has known mypy compatibility issues
# See: https://github.com/pydantic/pydantic/issues/5738
disable_error_code = ["typeddict-unknown-key", "assignment"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "celery.*",
    "uvicorn.*",
    "asyncpg.*",
    "sqlalchemy.*",
    "filetype.*",
    "magic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/*",
    "app/__pycache__/*",
]
branch = true

[tool.coverage.report]
omit = [
    "tests/test_migrations.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
skip_covered = false
skip_empty = true
fail_under = 39